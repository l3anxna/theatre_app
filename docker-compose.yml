services:
    app:
        build: .
        container_name: theatre_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - '.:/var/www'
        depends_on:
            - mysql
    nginx:
        image: 'nginx:latest'
        container_name: theatre_nginx
        ports:
            - '8000:80'
        volumes:
            - '.:/var/www'
            - './docker/nginx.conf:/etc/nginx/conf.d/default.conf'
        depends_on:
            - app
    mysql:
        image: 'mysql:8.4'
        container_name: theatre_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: theatre_th
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
        ports:
            - '3306:3306'
        volumes:
            - 'mysql_data:/var/lib/mysql'
volumes:
    mysql_data: null
    sail-mysql:
        driver: local
